services:
  - type: web
    name: wezing-russia-forum
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m forum_bot.main
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "123456789"
      - key: PORT
        value: "10000"
      - key: DAILY_DISCOUNT_MIN
        value: "5"
      - key: DAILY_DISCOUNT_MAX
        value: "20"
      - key: GIFT_ANIMATION
        value: ""
