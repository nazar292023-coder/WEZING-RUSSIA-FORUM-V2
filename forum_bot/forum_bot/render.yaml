services:
  - type: web
    name: wezing-russia-forum
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m forum_bot.main
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
